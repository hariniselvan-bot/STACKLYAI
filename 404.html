<!-- =========================================================
     404 BACK NAVIGATION SUPPORT
     ========================================================= -->
<script>
(function () {

    /*
     * Save the page that opened 404.
     *
     * This is useful when 404.html is opened through
     * a normal link and browser history is not reliable.
     */
    const currentReferrer = document.referrer;

    if (
        currentReferrer &&
        !currentReferrer.includes("/404.html")
    ) {
        sessionStorage.setItem(
            "404PreviousPage",
            currentReferrer
        );
    }

})();
</script>

<!-- =========================================================
     404 PAGE JAVASCRIPT
     ========================================================= -->

<script>

(function () {

    "use strict";


    /* =====================================================
       GO BACK
       ===================================================== */

    const backButton = document.querySelector("[data-back]");


    if (backButton && backButton.dataset.stacklyBackBound !== "true") {

        backButton.dataset.stacklyBackBound = "true";

        backButton.addEventListener("click", function (event) {

            event.preventDefault();

            if (backButton.classList.contains("is-loading")) {
                return;
            }

            backButton.classList.add("is-loading");

            if (window.history.length > 1) {
                window.history.back();
                return;
            }

            const previousPage =
                sessionStorage.getItem("404PreviousPage");

            if (previousPage) {

                sessionStorage.removeItem(
                    "404PreviousPage"
                );

                window.location.href = previousPage;

                return;
            }

            if (
                document.referrer &&
                !document.referrer.includes("/404.html")
            ) {

                window.location.href =
                    document.referrer;

                return;
            }

            window.location.href = "index.html";

        });

    }


    /* =====================================================
       SEARCH
       ===================================================== */

    const searchForm =
        document.getElementById("errorSearchForm");


    const searchInput =
        document.getElementById("errorSearch");


    if (searchForm && searchInput) {

        searchForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const query =
                    searchInput.value.trim();


                if (!query) {

                    searchInput.focus();

                    return;

                }


                /*
                 * Replace this with your actual
                 * search page when available.
                 */

                window.location.href =
                    "blog.html?search=" +
                    encodeURIComponent(query);

            }
        );

    }


    /* =====================================================
       INITIALIZE AOS
       ===================================================== */

    if (typeof AOS !== "undefined") {

        AOS.init({
            once: true,
            duration: 700,
            offset: 40
        });

    }


    /* =====================================================
       HANDLE PAGE RESTORATION
       ===================================================== */

    window.addEventListener(
        "pageshow",
        function () {

            /*
             * Refresh AOS after browser history restoration.
             */

            if (typeof AOS !== "undefined") {
                AOS.refresh();
            }

        }
    );


})();

</script>
